services:
  neo4j-memory:
    image: neo4j:5.26
    container_name: p2p-neo4j-memory
    restart: unless-stopped
    ports:
      - "7475:7474"
      - "7688:7687"
    environment:
      - NEO4J_AUTH=neo4j/neo4jpassword
    volumes:
      - neo4j_memory_data:/data
      - neo4j_memory_logs:/logs

  qdrant-memory:
    image: qdrant/qdrant:v1.13.2
    container_name: p2p-qdrant-memory
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_memory_data:/qdrant/storage

  memory-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: p2p-memory-service
    restart: unless-stopped
    depends_on:
      - neo4j-memory
      - qdrant-memory
    ports:
      - "5055:5055"
    env_file:
      - .env
    environment:
      - PORT=5055
      - NODE_ENV=production
      - MEMORY_WEBHOOK_SECRET=change-this-secret
      - NEO4J_URI=bolt://neo4j-memory:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=neo4jpassword
      - VECTOR_ENABLED=true
      - QDRANT_URL=http://qdrant-memory:6333
      - QDRANT_COLLECTION=p2p_memory_chunks
      - EMBEDDING_PROVIDER=local-hash
      - EMBEDDING_MODEL=text-embedding-3-small
      - EMBEDDING_DIMENSION=384
      - ANSWER_TMP_DIR=/app/tmp/agent-answers
      - KEYWORD_WEIGHT=0.55
      - VECTOR_WEIGHT=0.45
      - GRAPH_WEIGHT=0.30
      - RRF_K=60
      - MIN_VECTOR_SCORE=0.15
      - PROJECT_ROOT=/workspace
      - INGEST_GLOB=**/*.{js,ts,tsx,jsx,json,md,yml,yaml,java}
      - EXCLUDE_GLOBS=**/node_modules/**,**/dist/**,**/build/**,**/.git/**,**/coverage/**,**/.gradle/**,**/bin/**,**/obj/**,**/.settings/**,**/.project/**,**/.classpath/**,**/gradle/wrapper/**,**/PII/**,**/test-results/**,**/target/**,**/mifos-web-app/**,**/blockchain/**,**/P2P_Lending/client/**,**/.idea/**,**/.vscode/**
      - MAX_FILE_SIZE_BYTES=524288
      - CHUNK_SIZE_LINES=80
      - CHUNK_OVERLAP_LINES=10
      - AUTO_INGEST_ENABLED=false
      - AUTO_INGEST_INTERVAL_SEC=900
      - MASK_PII=true
      - METRIC_WINDOW_SIZE=200
    volumes:
      - ../admin_web:/workspace/admin_web:ro
      - ../client_new:/workspace/client_new:ro
      - ../server_do_an_new:/workspace/server_do_an_new:ro
      - ./tmp:/app/tmp

volumes:
  neo4j_memory_data:
  neo4j_memory_logs:
  qdrant_memory_data:
