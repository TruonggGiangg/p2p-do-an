version: "3.8"

services:
  aiscore-service:
    build: .
    ports:
      - "8001:8001"
    image: aiscore-service:latest
    container_name: aiscore-service
    environment:
      - PORT=8001
      - PYTHONUNBUFFERED=1
    volumes:
      - ./models:/app/models
    deploy:
      resources:
        limits:
          memory: 512M
    restart: always
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/api/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
