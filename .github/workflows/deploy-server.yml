name: Deploy P2P Server

on:
  push:
    branches: [main]
    paths:
      - 'server_do_an_new/**'
      - '.github/workflows/deploy-server.yml'
  workflow_dispatch:

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/p2p-server
  CONTAINER_NAME: p2p-server

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './server_do_an_new/package-lock.json'

      - name: Install dependencies
        working-directory: ./server_do_an_new
        run: npm ci

      - name: Run unit tests with coverage
        working-directory: ./server_do_an_new
        run: npm run test:ci

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ./server_do_an_new/coverage/
          retention-days: 7

  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image_tag: ${{ steps.vars.outputs.sha_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve tags
        id: vars
        run: echo "sha_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: ./server_do_an_new
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.vars.outputs.sha_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: SSH & Deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "=== Ensuring directory structure ==="
            mkdir -p /opt/p2p/logs
            mkdir -p /opt/p2p/scripts

            echo "=== Deploying backup-logs.sh ==="
            cat << 'EOF' > /opt/p2p/scripts/backup-logs.sh
            #!/bin/bash
            LOG_DIR="/opt/p2p/logs"
            BACKUP_DIR="/opt/p2p/backups/logs"
            RETENTION_DAYS=30

            echo "=========================================="
            echo "Starting Log Backup: $(date)"
            echo "=========================================="
            mkdir -p "$BACKUP_DIR"

            if [ -d "$LOG_DIR" ]; then
                echo "Scanning for zipped logs in $LOG_DIR..."
                find "$LOG_DIR" -name "*.gz" -type f | while read -r logfile; do
                    filename=$(basename "$logfile")
                    if [ ! -f "$BACKUP_DIR/$filename" ]; then
                        cp "$logfile" "$BACKUP_DIR/"
                        echo "Copied $filename to backup directory."
                    else
                        echo "$filename already exists in backup, skipping."
                    fi
                done
            else
                echo "Directory $LOG_DIR does not exist. Skipping backup."
            fi

            echo "Cleaning up log backups older than $RETENTION_DAYS days in $BACKUP_DIR..."
            if [ -d "$BACKUP_DIR" ]; then
                find "$BACKUP_DIR" -name "*.gz" -type f -mtime +$RETENTION_DAYS -delete -print | while read -r deleted; do
                    echo "Deleted old backup: $(basename "$deleted")"
                done
            fi

            echo "Log Backup finished successfully at $(date)."
            echo "=========================================="
            EOF
            chmod +x /opt/p2p/scripts/backup-logs.sh

            echo "=== Registering Cron Job ==="
            crontab -l 2>/dev/null | grep -q "/opt/p2p/scripts/backup-logs.sh"
            if [ $? -ne 0 ]; then
                (crontab -l 2>/dev/null; echo "0 0 * * * /opt/p2p/scripts/backup-logs.sh >> /opt/p2p/logs/backup-cron.log 2>&1") | crontab -
                echo "Registered daily backup cron job!"
            fi

            echo "=== Pulling latest image ==="
            docker pull ${{ env.IMAGE }}:latest

            echo "=== Stopping old container ==="
            docker stop ${{ env.CONTAINER_NAME }} 2>/dev/null || true
            docker rm ${{ env.CONTAINER_NAME }} 2>/dev/null || true

            echo "=== Starting new container ==="
            docker run -d \
              --name ${{ env.CONTAINER_NAME }} \
              --restart unless-stopped \
              --network p2p-network \
              --log-opt max-size=10m \
              --log-opt max-file=3 \
              --env-file /opt/p2p/.env.server \
              -p 127.0.0.1:3001:3001 \
              -v /opt/p2p/fabric-config:/app/fabric-config \
              -v /opt/p2p/fabric-wallet:/app/fabric-wallet \
              -v /opt/p2p/logs:/app/logs \
              ${{ env.IMAGE }}:latest

            echo "=== Ensuring Log Viewer (Dozzle) ==="
            docker stop p2p-log-viewer 2>/dev/null || true
            docker rm p2p-log-viewer 2>/dev/null || true
            docker run -d \
              --name p2p-log-viewer \
              --restart unless-stopped \
              --network p2p-network \
              -v /var/run/docker.sock:/var/run/docker.sock:ro \
              -e DOZZLE_USERNAME=admin \
              -e DOZZLE_PASSWORD=p2ppassword123 \
              -p 8888:8080 \
              amir20/dozzle:latest

            echo "=== Connecting to Fabric network ==="
            docker network connect fabric_test ${{ env.CONTAINER_NAME }} || true

            echo "=== Health Check (HTTP) ==="
            MAX_RETRIES=6
            RETRY_INTERVAL=5
            HEALTH_OK=false

            for i in $(seq 1 $MAX_RETRIES); do
              echo "Attempt $i/$MAX_RETRIES..."
              HTTP_CODE=$(curl -s -o /tmp/health_response.json -w "%{http_code}" \
                http://127.0.0.1:3001/api/health 2>/dev/null || echo "000")
              
              if [ "$HTTP_CODE" = "200" ]; then
                echo "✅ Health check PASSED (HTTP 200)"
                cat /tmp/health_response.json | python3 -m json.tool 2>/dev/null || cat /tmp/health_response.json
                HEALTH_OK=true
                break
              else
                echo "⏳ Server not ready (HTTP $HTTP_CODE), retrying in ${RETRY_INTERVAL}s..."
                sleep $RETRY_INTERVAL
              fi
            done

            if [ "$HEALTH_OK" = false ]; then
              echo "❌ Health check FAILED after $MAX_RETRIES attempts"
              docker logs --tail 30 ${{ env.CONTAINER_NAME }}
              exit 1
            fi

            echo ""
            echo "=== Readiness Check (External Services) ==="
            READY_CODE=$(curl -s -o /tmp/ready_response.json -w "%{http_code}" \
              http://127.0.0.1:3001/api/health/ready 2>/dev/null || echo "000")
            
            if [ "$READY_CODE" = "200" ]; then
              echo "✅ All services READY"
            else
              echo "⚠️  Some services degraded (HTTP $READY_CODE) — not blocking deploy"
            fi
            cat /tmp/ready_response.json | python3 -m json.tool 2>/dev/null || cat /tmp/ready_response.json

            echo ""
            echo "=== Rate Limit Verification ==="
            echo "Sending 6 rapid POST requests to /api/auth/login (limit: 5/min)..."
            RATE_LIMITED=false
            for i in $(seq 1 6); do
              RL_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
                -X POST http://127.0.0.1:3001/api/auth/login \
                -H "Content-Type: application/json" \
                -d '{"username":"ratelimit-test","password":"test"}' 2>/dev/null || echo "000")
              echo "  Request $i → HTTP $RL_CODE"
              if [ "$RL_CODE" = "429" ]; then
                RATE_LIMITED=true
              fi
            done

            if [ "$RATE_LIMITED" = true ]; then
              echo "✅ Rate Limiter ACTIVE — HTTP 429 returned as expected"
            else
              echo "⚠️  Rate limiter did not trigger (may need more requests or different TTL)"
            fi

            echo ""
            echo "=== Deployment Summary ==="
            echo "🚀 Server: RUNNING"
            echo "🏥 Health:  $( [ "$HEALTH_OK" = true ] && echo 'OK' || echo 'FAILED' )"
            echo "📡 Ready:   HTTP $READY_CODE"
            echo "🛡️  RateLimit: $( [ "$RATE_LIMITED" = true ] && echo 'ACTIVE' || echo 'NOT VERIFIED' )"
            echo ""

            docker image prune -f
