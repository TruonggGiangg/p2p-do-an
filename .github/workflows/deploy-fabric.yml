name: Setup Fabric Test Network

on:
  workflow_dispatch:

jobs:
  setup-fabric:
    name: Setup Fabric Network
    runs-on: ubuntu-latest
    steps:
      - name: SSH & Run Setup Script
        uses: appleboy/ssh-action@v1.2.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GITHUB_TOKEN
          script: |
            echo "=== Ensuring repo exists ==="
            if [ ! -d ~/p2p-do-an ]; then
              git clone https://oauth2:${GITHUB_TOKEN}@github.com/TruonggGiangg/p2p-do-an.git ~/p2p-do-an
            fi
            
            cd ~/p2p-do-an
            git fetch --all
            git reset --hard origin/main
            git pull https://oauth2:${GITHUB_TOKEN}@github.com/TruonggGiangg/p2p-do-an.git main
            
            echo "=== Running Fabric Setup Script ==="
            chmod +x scripts/setup-fabric-server.sh
            ./scripts/setup-fabric-server.sh
