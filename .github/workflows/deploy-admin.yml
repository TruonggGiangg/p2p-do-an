name: Deploy Admin Web

on:
  push:
    branches: [main]
    paths:
      - 'admin_web/**'
      - '.github/workflows/deploy-admin.yml'
  workflow_dispatch:

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/p2p-admin-web
  CONTAINER_NAME: p2p-admin-web

jobs:
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.sha_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve tags
        id: vars
        run: echo "sha_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: ./admin_web
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.vars.outputs.sha_tag }}
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: SSH & Deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "=== Pulling latest image ==="
            docker pull ${{ env.IMAGE }}:latest

            echo "=== Stopping old container ==="
            docker stop ${{ env.CONTAINER_NAME }} 2>/dev/null || true
            docker rm ${{ env.CONTAINER_NAME }} 2>/dev/null || true

            echo "=== Starting new container ==="
            docker run -d \
              --name ${{ env.CONTAINER_NAME }} \
              --restart unless-stopped \
              --network p2p-network \
              -p 5173:80 \
              ${{ env.IMAGE }}:latest

            echo "=== Replace API URL ==="
            docker exec ${{ env.CONTAINER_NAME }} sh -c "find /usr/share/nginx/html -type f -name '*.js' -exec sed -i 's|http://localhost:3001|https://backend.social-chat-xuanho.io.vn|g' {} + || true"
            docker exec ${{ env.CONTAINER_NAME }} sh -c "find /usr/share/nginx/html -type f -name '*.js' -exec sed -i 's|http://13.251.106.252:3001|https://backend.social-chat-xuanho.io.vn|g' {} + || true"

            echo "=== Health check ==="
            sleep 3
            if docker ps | grep -q ${{ env.CONTAINER_NAME }}; then
              echo "✅ Admin Web deployed!"
            else
              echo "❌ Failed!"
              docker logs ${{ env.CONTAINER_NAME }}
              exit 1
            fi

            docker image prune -f
